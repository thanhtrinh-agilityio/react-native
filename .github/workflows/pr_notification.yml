name: Notify Slack on PR to Dev

on:
  pull_request:
    branches: ['dev', 'stag', 'release']
    types: [opened, reopened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          AUTHOR_NAME="${{ github.actor }}"
          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${GITHUB_REF_NAME}"
          COMPARE_URL="${{ github.event.compare }}"

          COMMITS=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[] | "• \(.id[0:8]): \(.message) - \(.author.name)"')

          MESSAGE="*${AUTHOR_NAME}* pushed to branch \`${BRANCH_NAME}\` of \`${REPO_NAME}\`\n [Compare changes](${COMPARE_URL})\n\n${COMMITS}"

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${MESSAGE}\"}" \
            $SLACK_WEBHOOK_URL
