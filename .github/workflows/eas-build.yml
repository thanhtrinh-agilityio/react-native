name: Development + Staging + Production Workflow

on:
  pull_request:
    branches: ['dev', 'stag', 'release']
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: read
  checks: write

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
          key: deps-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - run: yarn install --frozen-lockfile
      - run: yarn test

  lint:
    name: Run Lint
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1

      - run: yarn install --frozen-lockfile
      - run: yarn lint

  eas:
    name: EAS Build or Update (${{ matrix.env }})
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - env: dev
            ref: dev
            type: build
            profile: preview
            build_type: local
          - env: stag
            ref: stag
            type: update
            profile: preview
            branch: preview
          - env: release
            ref: release
            type: build
            profile: production
            build_type: remote
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
          key: deps-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: deps-${{ runner.os }}-

      - run: yarn install --frozen-lockfile

      - run: npm install -g eas-cli

      - name: Run EAS ${{ matrix.type }}
        if: github.base_ref == matrix.ref
        run: |
          export EXPO_PUBLIC_OPENROUTER_API_KEY="${{ secrets.EXPO_PUBLIC_OPENROUTER_API_KEY }}"
          export EXPO_PUBLIC_OPENROUTER_MODEL="${{ secrets.EXPO_PUBLIC_OPENROUTER_MODEL }}"
          export EXPO_PUBLIC_OPENROUTER_API_URL="${{ secrets.EXPO_PUBLIC_OPENROUTER_API_URL }}"
          export EXPO_PUBLIC_OPENROUTER_TITLE="${{ secrets.EXPO_PUBLIC_OPENROUTER_TITLE }}"
          export EXPO_PUBLIC_STORYBOOK_ENABLED="${{ secrets.EXPO_PUBLIC_STORYBOOK_ENABLED }}"
          if [ "${{ matrix.type }}" = "build" ]; then
            eas build --platform android $([ "${{ matrix.build_type }}" = "local" ] && echo "--local") --non-interactive --profile ${{ matrix.profile }} --wait
          else
            eas update --branch ${{ matrix.branch }} --non-interactive --message "🔄 Update from CI"
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK (only for dev)
        if: matrix.env == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-dev
          path: ${{ github.workspace }}/build-*.apk
        continue-on-error: true

      - name: Comment PR with Expo Link
        if: success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            **Expo ${{ matrix.env == 'release' && 'Production' || 'Preview' }} Ready**
            [Open in Expo Go](${{ matrix.env == 'release' && 'https://expo.dev/accounts/thanh.trinh-agilityo/projects/rak-gpt/builds' || 'https://expo.dev/accounts/thanh.trinh-agilityo/projects/rak-gpt/branches/preview' }})
